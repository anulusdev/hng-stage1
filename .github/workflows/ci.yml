name: Insighta CI/CD Pipeline

# This triggers the action whenever you make a Pull Request to main,
# or when you directly push to main.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with Flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat all other styling issues as warnings so it doesn't fail the build
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Build Check & Tests
      env:
        # We provide dummy env vars so Django doesn't crash during checks
        SECRET_KEY: 'dummy-key-for-ci-only'
        WEB_GITHUB_CLIENT_ID: 'dummy'
        WEB_GITHUB_CLIENT_SECRET: 'dummy'
      run: |
        # If this is a Django repo (Backend or Web Portal), run Django's built-in checks and tests
        if [ -f manage.py ]; then
          echo "Django project detected. Running checks..."
          python manage.py check
          python manage.py test
        else
          echo "CLI project detected. Skipping Django checks."
        fi